# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Franciacorta Wine Club
email: info@franciacortawineclub.it
description: >- # this means to ignore newlines until "baseurl:"
  Un gruppo di amici con la passione per il vino, la gastronomia e i viaggi.
  Le foto dei nostri viaggi enogastronomici in Italia e nel mondo.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.franciacortawineclub.it" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
sass:
  sass_dir: _sass
  style: compressed
markdown: kramdown
theme: minima
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
include: ['_pages', 'viaggi', 'notiziario']

# Il notiziario è in _data/notiziario.yml (istruzioni in README.md)
instagram: franciacorta_wine_club

# Viaggi: un file per viaggio in _viaggi/ (es. _viaggi/2026-bordeaux.html)
# e le foto in img/viaggi/<stesso nome>/. Istruzioni in README.md
collections:
  viaggi:
    output: true
    permalink: /:name

defaults:
  - scope:
      path: ""
      type: viaggi
    values:
      layout: viaggio

mesi: [gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
giorni: [domenica, lunedì, martedì, mercoledì, giovedì, venerdì, sabato]
